<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentRide - Self-Drive Cars & Bikes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Top Navigation Bar for Seamless Hub Access -->
<div style="background:#0f172a; color:#f8fafc; padding:10px 16px; font-family:sans-serif; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0284c7; position:sticky; top:0; z-index:9999;">
    <div>
        <a href="../index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:6px;">
            🏠 ← Back to All Experiments (1-46)
        </a>
    </div>
    <div>
        <strong>Experiment 20:</strong> RentRide Vehicle Rental Platform
    </div>
    <div style="font-size:0.75rem; color:#94a3b8;">
        CSA4303 IP Lab • SIMATS
    </div>
</div>

    <header class="header">
        <h1>🚗 Rent<span>Ride</span></h1>
        <p>Affordable Self-Drive &amp; Chauffeur Rentals</p>
    </header>
    <main class="container">
        <div class="booking-widget">
            <div class="form-row">
                <div>
                    <label>Pickup City</label>
                    <select id="rentCity"><option>Chennai</option><option>Coimbatore</option><option>Bangalore</option></select>
                </div>
                <div>
                    <label>Rental Duration (Days)</label>
                    <input type="number" id="rentDays" value="2" min="1" max="30" onchange="calcTotal()">
                </div>
                <div>
                    <label>Driver Option</label>
                    <select id="driverOpt" onchange="calcTotal()"><option value="0">Self Drive (₹0)</option><option value="500">With Driver (+₹500/day)</option></select>
                </div>
            </div>
        </div>
        <div id="fleetGrid" class="fleet-grid"></div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
