<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBank - LifeSave Blood Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Top Navigation Bar for Seamless Hub Access -->
<div style="background:#0f172a; color:#f8fafc; padding:10px 16px; font-family:sans-serif; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0284c7; position:sticky; top:0; z-index:9999;">
    <div>
        <a href="../index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:6px;">
            🏠 ← Back to All Experiments (1-46)
        </a>
    </div>
    <div>
        <strong>Experiment 23:</strong> Blood Management Information System
    </div>
    <div style="font-size:0.75rem; color:#94a3b8;">
        CSA4303 IP Lab • SIMATS
    </div>
</div>

    <header class="header">
        <h1>🩸 LifeSave <span>Blood Bank</span></h1>
        <p>Real-Time Hospital Blood Stock &amp; Emergency Donor Registry</p>
    </header>
    <main class="container">
        <div class="stock-cards" id="stockGrid"></div>
        <section class="card" style="margin-top:20px;">
            <h3>Emergency Patient Blood Requisition</h3>
            <form onsubmit="requestBlood(event)">
                <div class="row">
                    <div>
                        <label>Patient Full Name *</label>
                        <input type="text" id="patName" required placeholder="Patient Name">
                    </div>
                    <div>
                        <label>Hospital &amp; City *</label>
                        <input type="text" id="patHosp" required placeholder="e.g. Saveetha Medical Hospital">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Required Blood Group *</label>
                        <select id="reqBlood">
                            <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
                        </select>
                    </div>
                    <div>
                        <label>Units Required *</label>
                        <input type="number" id="reqUnits" value="1" min="1" max="5" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Dispatch Urgent Hospital Request</button>
            </form>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
