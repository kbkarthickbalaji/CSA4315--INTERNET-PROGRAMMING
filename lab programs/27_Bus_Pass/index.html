<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusPass - Transport Pass Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Top Navigation Bar for Seamless Hub Access -->
<div style="background:#0f172a; color:#f8fafc; padding:10px 16px; font-family:sans-serif; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0284c7; position:sticky; top:0; z-index:9999;">
    <div>
        <a href="../index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:6px;">
            🏠 ← Back to All Experiments (1-46)
        </a>
    </div>
    <div>
        <strong>Experiment 27:</strong> Bus Pass Management System
    </div>
    <div style="font-size:0.75rem; color:#94a3b8;">
        CSA4303 IP Lab • SIMATS
    </div>
</div>

    <header class="header">
        <h1>🚌 Metropolitan <span>Bus Pass Portal</span></h1>
        <p>Student, Senior Citizen &amp; Regular Commuter Smart Cards</p>
    </header>
    <main class="container">
        <section class="card">
            <h3>Apply for New E-Bus Pass / Concession</h3>
            <form onsubmit="applyPass(event)">
                <div class="row">
                    <div>
                        <label>Passenger Full Name *</label>
                        <input type="text" id="passName" required placeholder="e.g. Karthick Balaji">
                    </div>
                    <div>
                        <label>Pass Category *</label>
                        <select id="passType" onchange="calcPassFare()">
                            <option value="Student|250">Student Concession (₹250 / mo)</option>
                            <option value="Senior Citizen|150">Senior Citizen (₹150 / mo)</option>
                            <option value="General Monthly|800">General Public Commuter (₹800 / mo)</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Starting Bus Stop *</label>
                        <input type="text" id="fromStop" required placeholder="e.g. Poonamallee Depot">
                    </div>
                    <div>
                        <label>Destination Stop *</label>
                        <input type="text" id="toStop" required placeholder="e.g. Saveetha Engineering Campus">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Pass Validity Duration *</label>
                        <select id="passDur" onchange="calcPassFare()"><option value="1">1 Month</option><option value="3">3 Months (Quarterly)</option><option value="6">6 Months (Semester)</option></select>
                    </div>
                    <div>
                        <label>Total Pass Fee (₹)</label>
                        <input type="text" id="passTotal" value="250" readonly>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Generate Instant E-Pass Card</button>
            </form>
        </section>
        <section id="passCardArea" style="margin-top:20px;"></section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
