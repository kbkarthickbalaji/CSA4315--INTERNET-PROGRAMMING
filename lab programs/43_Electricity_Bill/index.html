<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerBill - Electricity Board Billing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Top Navigation Bar for Seamless Hub Access -->
<div style="background:#0f172a; color:#f8fafc; padding:10px 16px; font-family:sans-serif; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0284c7; position:sticky; top:0; z-index:9999;">
    <div>
        <a href="../index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:6px;">
            🏠 ← Back to All Experiments (1-46)
        </a>
    </div>
    <div>
        <strong>Experiment 43:</strong> Online Electricity Bill Payment Portal
    </div>
    <div style="font-size:0.75rem; color:#94a3b8;">
        CSA4303 IP Lab • SIMATS
    </div>
</div>

    <header class="header">
        <h1>⚡ Power<span>Bill</span></h1>
        <p>State Electricity Distribution Corporation - Online Billing Portal</p>
    </header>
    <main class="container">
        <section class="card">
            <h3>Calculate &amp; Pay Bi-Monthly Electricity Bill</h3>
            <form onsubmit="calcPowerBill(event)">
                <div class="row">
                    <div>
                        <label>Consumer Number *</label>
                        <input type="text" id="consNo" required placeholder="e.g. 09-242-1601" value="09-242-1601">
                    </div>
                    <div>
                        <label>Units Consumed (Bi-Monthly) *</label>
                        <input type="number" id="unitsCount" required min="0" value="350">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:10px;">Calculate Bill by Government Tariff Slabs</button>
            </form>
            <div id="billResult" style="margin-top:20px;"></div>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
