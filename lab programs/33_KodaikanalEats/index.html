<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KodaikanalEats - Hill Station Restaurant Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Top Navigation Bar for Seamless Hub Access -->
<div style="background:#0f172a; color:#f8fafc; padding:10px 16px; font-family:sans-serif; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #0284c7; position:sticky; top:0; z-index:9999;">
    <div>
        <a href="../index.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; display:inline-flex; align-items:center; gap:6px;">
            🏠 ← Back to All Experiments (1-46)
        </a>
    </div>
    <div>
        <strong>Experiment 33:</strong> KodaikanalEats Restaurant Dining Platform
    </div>
    <div style="font-size:0.75rem; color:#94a3b8;">
        CSA4303 IP Lab • SIMATS
    </div>
</div>

    <header class="header">
        <h1>🍲 Kodaikanal<span>Eats</span></h1>
        <p>Book Tables &amp; Special Dining Across Scenic Hill Cafes &amp; Restaurants</p>
    </header>
    <main class="container">
        <section class="card">
            <h3>Reserve a Scenic Table</h3>
            <form onsubmit="bookTable(event)">
                <div class="row">
                    <div>
                        <label>Select Restaurant *</label>
                        <select id="restSelect">
                            <option>Cloud Street Cafe (Italian & Woodfired Pizza)</option>
                            <option>Tava Hillside (Authentic Indian & Tawa Specialties)</option>
                            <option>Tibetan Brothers (Misty Valley Momos & Thukpa)</option>
                        </select>
                    </div>
                    <div>
                        <label>Seating Preference *</label>
                        <select id="seatPref"><option>Outdoor Valley View Terrace</option><option>Cozy Indoor Fireplace</option><option>Private Garden Cabana</option></select>
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label>Date &amp; Time *</label>
                        <input type="datetime-local" id="bookDateTime" required>
                    </div>
                    <div>
                        <label>Number of Guests *</label>
                        <input type="number" id="guestCount" value="2" min="1" max="15" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Confirm Table Reservation</button>
            </form>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
